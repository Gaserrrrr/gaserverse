<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gaserverse — Portfolio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Inter:wght@400;600;800&family=Noto+Serif:wght@400&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0a1122;--card:#121b33;--tx:#e9edf6;--mu:#9aa6bd;--ac:#a9bcf5;--bd:#223052;--btn:#dfe6f7;--btx:#0a1122}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e9ecf2;--card:#fff;--tx:#10182e;--mu:#5d6679;--ac:#1d3068;--bd:#d3d8e3;--btn:#14213d;--btx:#fff}}
:root[data-theme="light"]{--bg:#e9ecf2;--card:#fff;--tx:#10182e;--mu:#5d6679;--ac:#1d3068;--bd:#d3d8e3;--btn:#14213d;--btx:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 Inter,system-ui,sans-serif}
.hero{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;position:relative;color:#fff;
background:linear-gradient(180deg,rgba(255,255,255,0) 60%,rgba(185,196,218,.5) 100%),repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,rgba(0,0,0,.07) 1px 3px),linear-gradient(180deg,#0f1b38,#1b2a50 45%,#6b7385);
animation:in 1.6s ease both}
.hero:after{content:"";position:absolute;inset:0;opacity:.18;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
.hero>*{position:relative;z-index:1}
@keyframes in{from{opacity:0;filter:blur(8px)}to{opacity:1;filter:none}}
.hero h1{font:600 clamp(3.4rem,15vw,6.5rem)/1 "Dancing Script",cursive;margin:0;color:#fff}
.script{font:600 clamp(2.6rem,11vw,5rem)/1 "Dancing Script",cursive;color:#b9c4de;margin:-.1em 0 .4em}
.tag{font:400 clamp(1rem,3.6vw,1.4rem)/1.4 "Noto Serif",serif;letter-spacing:.14em;color:#f2f2f2;margin:0}
.cue{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:1;color:#0a1122;font-size:.8rem;letter-spacing:.3em;text-transform:uppercase;text-decoration:none}
main{max-width:820px;margin:0 auto;padding:10px 20px 90px}
h2{font:800 .8rem Inter,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mu);margin:3.2em 0 1em}
p{margin:.5em 0}.mu{color:var(--mu)}
.role{font:400 1.2rem "Noto Serif",serif;letter-spacing:.06em;margin-top:2em}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:4px 14px;font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px}
.card h3{margin:0 0 4px;font-size:1.05rem}
.num{font:600 .8rem Inter;color:var(--mu);letter-spacing:.15em}
.hero h1,.script{transition:transform .35s ease,text-shadow .35s ease;cursor:default}
@media(hover:hover){.hero h1:hover{transform:translateY(-4px) scale(1.03);text-shadow:0 0 26px rgba(169,188,245,.6)}.script:hover{transform:translateY(-3px) scale(1.05);text-shadow:0 0 24px rgba(200,212,255,.55)}.card{transition:transform .25s ease,border-color .25s ease}.card:hover{transform:translateY(-3px);border-color:var(--ac)}}
.tabs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:2.2em}
.tab{background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:9px 22px;font-size:.9rem;letter-spacing:.06em}
.tab.on{background:var(--btn);color:var(--btx)}
.hero .tab{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(4px);transition:background .25s,transform .25s}
@media(hover:hover){.hero .tab:hover{background:rgba(255,255,255,.28);transform:translateY(-2px)}}
.top{max-width:820px;margin:0 auto;padding:16px 20px 0;display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.top .tabs{margin:0}.op .top{padding-top:62px}
main{animation:in .45s ease both}
.cue{background:none!important;border:0!important;padding:0!important;animation:bob 1.6s ease-in-out infinite;color:#0a1122!important}
@keyframes bob{50%{transform:translateY(7px)}}
button,.chip,a,input,select,textarea,.cover img,.tag,.role{transition:transform .25s ease,background .25s ease,border-color .25s ease,box-shadow .25s ease,color .25s ease,letter-spacing .3s ease}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(169,188,245,.28)}
@media(hover:hover){
button:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.28)}
button.g:hover{border-color:var(--ac)}
.cue:hover{box-shadow:none;letter-spacing:.38em}
.chip:hover{transform:translateY(-2px);border-color:var(--ac);color:var(--ac)}
a:hover{text-decoration:underline;letter-spacing:.02em}
input:hover,select:hover,textarea:hover{border-color:var(--ac)}
.cover:hover img{transform:scale(1.05)}.cover{transition:border-color .25s}.cover:hover{border-color:var(--ac)}
.tag:hover{letter-spacing:.2em}.role:hover{color:var(--ac)}
.num{transition:color .25s}.card:hover .num{color:var(--ac)}
}
.cover{border-radius:10px;overflow:hidden;border:1px solid var(--bd);margin-bottom:12px;background:#0b0c0f}
.cbar{display:flex;gap:5px;padding:7px 10px;background:#1b1d23}.cbar i{width:8px;height:8px;border-radius:50%;background:#555}
.cover img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
.ph{aspect-ratio:16/10;display:grid;place-items:center;font:600 3.4rem "Dancing Script",cursive;color:#fff;background:linear-gradient(135deg,#5b5b5d,#2a2a2c)}
a{color:var(--ac)}.links{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}@media(max-width:520px){.row{grid-template-columns:1fr}}
button{font:600 .95rem Inter;background:var(--btn);color:var(--btx);border:0;border-radius:99px;padding:11px 22px;cursor:pointer}
button.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button.s{padding:4px 12px;font-size:.8rem;margin:8px 6px 0 0}
.bar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:12px;display:flex;gap:8px;z-index:9}
.ed [contenteditable]{outline:1px dashed #8aa;outline-offset:3px;border-radius:4px;min-height:1em}
#st{margin-top:8px;font-size:.9rem}.req{border-left:3px solid var(--ac);margin-bottom:12px}.done{opacity:.55}
.rv{opacity:0;transform:translateY(22px);transition:opacity .6s ease,transform .6s ease,border-color .25s,box-shadow .25s}
.rv.show{opacity:1;transform:none}
button,.chip,.cover img,.ph{transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease,background .25s ease,opacity .25s}
.cover img,.ph{transition:transform .5s ease}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(169,188,245,.25)}
@media(hover:hover){
button:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.chip:hover{border-color:var(--ac);transform:translateY(-2px)}
a:hover{opacity:.7}
.card.rv.show:hover{transform:translateY(-3px);border-color:var(--ac)}
.cover:hover img,.cover:hover .ph{transform:scale(1.06)}
.req:hover{border-color:var(--ac)}}
</style></head>

<script>
const D=JSON.parse(document.getElementById('data').textContent);
const app=document.getElementById('app');
let editing=false,owner=false,fields=[],db=null,art=null,unsub=null;
const $=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const wa=()=>String(D.whatsapp||'').replace(/\D/g,'');
function F(tag,cls,get,set){const e=$(tag,cls,get());if(editing)e.contentEditable='true';fields.push({e,set});return e}
function commit(){fields.forEach(f=>f.set(f.e.textContent.trim()))}
function link(txt,href){const a=$('a',null,txt);a.href=href;a.target='_blank';a.rel='noopener';return a}
function items(m,title,id,arr,blank,build){
  const h=$('h2',null,title);h.id=id;m.append(h);const g=$('div','grid');
  arr.forEach((o,i)=>{const c=$('div','card');build(c,o,i);
    if(editing){const r=$('button','g s','Remove');r.onclick=()=>{commit();arr.splice(i,1);render()};c.append(r)}g.append(c)});
  m.append(g);
  if(editing){const a=$('button','g s','+ Add');a.style.marginTop='12px';a.onclick=()=>{commit();arr.push({...blank});render()};m.append(a)}
}
let view='home',firstPaint=true;
function go(v){if(editing)commit();view=v;render();const m=document.querySelector('main');if(m)requestAnimationFrame(()=>m.scrollIntoView({behavior:'smooth',block:'start'}));else scrollTo(0,0)}
function tabs(){const t=$('div','tabs');[['about','About'],['work','Projects'],['contact','Contact']].forEach(([k,l])=>{const x=$('button',k===view?'tab on':'tab',l);x.onclick=()=>go(k);t.append(x)});return t}
function render(){render0();reveal()}
function reveal(){
  if(editing||!("IntersectionObserver" in window))return;
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("show");io.unobserve(e.target)}}),{threshold:.12});
  app.querySelectorAll("main .card,main h2,main .role,main .chips,main .row").forEach(el=>{el.classList.add("rv");io.observe(el)})}
function render0(){
  fields=[];app.innerHTML='';app.className=(editing?'ed ':'')+(owner?'op':'');
  if(owner){const b=$('div','bar');
    if(editing){const s=$('button',null,'Save & publish');s.onclick=save;const c=$('button','g','Cancel');c.onclick=()=>location.reload();b.append(s,c)}
    else{const e=$('button','g','Edit page');e.onclick=()=>{editing=true;render()};b.append(e)}
    app.append(b)}
  const h=$('section','hero');
  if(!firstPaint)h.style.animation='none';firstPaint=false;
  h.append(F('h1',null,()=>D.name,v=>D.name=v),F('div','script',()=>D.script,v=>D.script=v),F('p','tag',()=>D.tagline,v=>D.tagline=v),tabs());
  const cue=$('button','cue','Scroll ↓');cue.onclick=()=>go(view==='home'?'about':view);h.append(cue);
  app.append(h);
  if(view==='home')return;
  const m=$('main');
  if(view==='about'){
    m.append($('h2',null,'About'),F('div','role',()=>D.role,v=>D.role=v),F('p',null,()=>D.bio,v=>D.bio=v));
    if(editing){m.append($('p','mu','Skills (comma separated):'),F('p',null,()=>D.skills,v=>D.skills=v))}
    else{const c=$('div','chips');c.style.marginTop='14px';D.skills.split(',').map(s=>s.trim()).filter(Boolean).forEach(s=>c.append($('span','chip',s)));m.append(c)}
    const l=$('div','links');
    if(editing){l.append($('span','mu','GitHub URL:'),F('span',null,()=>D.github,v=>D.github=v),$('span','mu','Email:'),F('span',null,()=>D.email,v=>D.email=v),$('span','mu','WhatsApp (with country code):'),F('span',null,()=>D.whatsapp,v=>D.whatsapp=v))}
    else{if(D.github)l.append(link('GitHub',D.github));if(D.email)l.append(link(D.email,'mailto:'+D.email));if(wa())l.append(link('WhatsApp','https://wa.me/'+wa()))}
    m.append(l);
    items(m,'Services','services',D.services,{name:'New service',desc:'Describe it'},(c,o,i)=>{c.append($('div','num','0'+(i+1)),F('h3',null,()=>o.name,v=>o.name=v),F('p','mu',()=>o.desc,v=>o.desc=v))});
  }else if(view==='work'){
    items(m,'Projects','work',D.projects,{name:'New project',desc:'Describe it',url:'',tech:'',img:''},(c,o)=>{
      c.append(cover(o),F('h3',null,()=>o.name,v=>o.name=v),F('p','mu',()=>o.desc,v=>o.desc=v));
      if(editing){c.append($('p','mu','Tech (comma separated):'),F('p','mu',()=>o.tech||'',v=>o.tech=v),$('p','mu','Link:'),F('p','mu',()=>o.url,v=>o.url=v));
        const u=$('button','g s',o.img?'Change screenshot':'Upload screenshot');u.onclick=()=>pick(o);c.append(u);
        if(o.img){const x=$('button','g s','Remove image');x.onclick=()=>{commit();o.img='';render()};c.append(x)}}
      else{if(o.tech){const t=$('div','chips');t.style.margin='8px 0';o.tech.split(',').map(s=>s.trim()).filter(Boolean).forEach(s=>t.append($('span','chip',s)));c.append(t)}
        if(o.url)c.append(link('View project →',o.url))}});
  }else{
    contact(m);
    if(owner&&!editing){m.append($('h2',null,'Inbox (only you see this)'));const box=$('div');m.append(box);watch(box)}
  }
  const up=$('button','g s','↑ Back to top');up.style.marginTop='40px';up.onclick=()=>scrollTo({top:0,behavior:'smooth'});m.append(up);
  app.append(m);
}
function cover(o){
  const w=$('div','cover'),b=$('div','cbar');b.append($('i'),$('i'),$('i'));w.append(b);
  if(o.img){const im=new Image();im.src=o.img;im.alt=o.name||'';w.append(im)}else w.append($('div','ph',(o.name||'?').slice(0,1).toUpperCase()));
  return w}
function pick(o){
  commit();const i=document.createElement('input');i.type='file';i.accept='image/*';
  i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1000/im.width),cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);o.img=cv.toDataURL('image/jpeg',.78);render()};im.src=r.result};r.readAsDataURL(f)};
  i.click()}
function contact(m){
  const h=$('h2',null,'Start a project');h.id='contact';m.append(h);
  const mk=(t,ph,type)=>{const i=$(t);if(ph)i.placeholder=ph;if(type)i.type=type;return i};
  const n=mk('input','Full name *'),em=mk('input','Email','email'),co=mk('input','Phone / WhatsApp'),bu=mk('input','Budget (optional)');
  n.autocomplete='name';em.autocomplete='email';co.autocomplete='tel';
  const sv=$('select');['Choose a service',...D.services.map(s=>s.name),'Something else'].forEach(x=>sv.append($('option',null,x)));
  const tl=$('select');['Timeline','ASAP','1–2 weeks','2–4 weeks','1–3 months','Flexible'].forEach(x=>tl.append($('option',null,x)));
  const t=mk('textarea','Tell me about your project *');t.rows=4;
  const b=$('button',null,'Send request'),st=$('div');st.id='st';
  const r1=$('div','row');r1.append(n,em);const r2=$('div','row');r2.append(co,bu);const r3=$('div','row');r3.append(sv,tl);
  b.onclick=async()=>{
    const r={name:n.value.trim(),email:em.value.trim(),phone:co.value.trim(),budget:bu.value.trim(),service:sv.selectedIndex?sv.value:'',timeline:tl.selectedIndex?tl.value:'',message:t.value.trim()};
    if(!r.name||!r.message){st.textContent='Please add your name and project details.';return}
    if(r.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(r.email)){st.textContent='Please enter a valid email address.';return}
    b.disabled=true;b.textContent='Sending…';st.textContent='';
    try{
      const data=new FormData();
      data.append('_subject','New GaserVerse project request');
      data.append('name',r.name);data.append('email',r.email);data.append('phone',r.phone);
      data.append('budget',r.budget);data.append('service',r.service);data.append('timeline',r.timeline);data.append('message',r.message);
      const response=await fetch('https://formspree.io/f/xrpeqnkq',{method:'POST',body:data,headers:{'Accept':'application/json'}});
      if(!response.ok)throw new Error('Form submission failed');
      n.value=em.value=co.value=bu.value=t.value='';sv.selectedIndex=0;tl.selectedIndex=0;
      st.textContent='Thanks! Your request was sent successfully.';
    }catch(e){st.textContent='Sorry, your request could not be sent. Please try again or contact me directly.'}
    finally{b.disabled=false;b.textContent='Send request'}
  };
  m.append(r1,r2,r3,t,b,st);
}
function watch(box){
  if(!db)return;if(unsub)unsub();
  unsub=db.collection('requests').orderBy('at','desc').onSnapshot(s=>{
    box.innerHTML='';if(s.empty){box.append($('p','mu','No requests yet.'));return}
    s.docs.forEach(d=>{const r=d.data(),ref=db.collection('requests').doc(d.id),c=$('div','card req'+(r.status==='done'?' done':''));
      c.append($('h3',null,(r.name||'Anonymous')+(r.service?' · '+r.service:'')),
        $('p','mu',[r.email,r.phone,r.timeline,r.budget&&('Budget: '+r.budget),new Date(r.at).toLocaleString()].filter(Boolean).join(' · ')),$('p',null,r.message));
      const x=$('button','g s',r.status==='done'?'Mark new':'Mark done');x.onclick=()=>ref.update({status:r.status==='done'?'new':'done'});
      const y=$('button','g s','Delete');y.onclick=()=>ref.delete();c.append(x,y);box.append(c)})},()=>{});
}
async function save(){
  commit();
  const c=document.documentElement.cloneNode(true);
  c.querySelector('#app').innerHTML='';c.querySelector('#app').className='';
